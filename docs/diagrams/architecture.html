<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Muxin sits between you and a machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.75rem;
    }

    .note {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      line-height: 1.45;
      color: var(--color-muted);
      max-width: 42rem;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Muxin 0.5.6</p>
    <h1>How Muxin sits between you and a machine</h1>
    <p class="note">Architecture diagram, doc-inline (960 wide), shipped default skin (paper #f5f5f5, ink #2d3142, accent #bf4520). Not the app's own theme. Install modes, Tailscale, and the ssh-then-QUIC order are in the write-up.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">How Muxin sits between you and a machine</title>
        <desc id="architecture-desc">Muxin on this computer talks to muxen-agent on a machine you own, and to GitHub for runners and your account.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="960" height="560" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="32" y="48" width="448" height="132" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="44" y="52" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="100" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">THIS COMPUTER</text>

        <rect x="512" y="48" width="416" height="132" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="524" y="52" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="564" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">A MACHINE</text>

        <!-- Arrows, before boxes -->
        <line x1="224" y1="120" x2="248" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="448" y1="120" x2="536" y2="120" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="456" y="96" width="80" height="16" fill="#f5f5f5"/>
        <text x="496" y="108" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SSH / QUIC</text>
        <line x1="720" y1="120" x2="744" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="352" y1="160" x2="352" y2="312" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="360" y="224" width="56" height="16" fill="#f5f5f5"/>
        <text x="388" y="236" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GH API</text>

        <!-- You -->
        <rect x="56" y="80" width="168" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="80" width="168" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="64" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="78" y="97" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YOU</text>
        <text x="140" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">You</text>
        <text x="140" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">window, CLI, or agent</text>

        <!-- Muxin (focal) -->
        <rect x="256" y="80" width="192" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="80" width="192" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="264" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="278" y="97" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="352" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Muxin</text>
        <text x="352" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one API, three doors</text>

        <!-- muxen-agent -->
        <rect x="544" y="80" width="176" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="544" y="80" width="176" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="552" y="88" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="572" y="97" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="632" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">muxen-agent</text>
        <text x="632" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">~/.muxen/bin</text>

        <!-- Runner -->
        <rect x="752" y="84" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="752" y="84" width="144" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="760" y="92" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="774" y="101" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
        <text x="824" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Actions runner</text>
        <text x="824" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">on that machine</text>

        <!-- GitHub -->
        <rect x="256" y="320" width="192" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="320" width="192" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="264" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="278" y="337" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="352" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GitHub</text>
        <text x="352" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">your gh login</text>

        <!-- Legend -->
        <line x1="32" y1="468" x2="928" y2="468" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
        <rect x="48" y="492" width="16" height="16" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="72" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">You</text>
        <rect x="200" y="492" width="16" height="16" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="224" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Muxin</text>
        <rect x="380" y="492" width="16" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="404" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Program on the machine</text>
        <rect x="640" y="492" width="16" height="16" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="664" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Runner</text>
        <rect x="780" y="492" width="16" height="16" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="804" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">GitHub</text>
      </svg>
    </div>
  </div>
</body>
</html>
